[workspace]
resolver = "3"
members = ["crates/homebase-core", "crates/hbd", "crates/hb"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/Dev101911/Homebase"
authors = ["TulipByte Studio"]

[workspace.dependencies]
homebase-core = { path = "crates/homebase-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "macros", "signal", "sync", "time"] }
portable-pty = "0.9"
libc = "0.2"
tempfile = "3"
